[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chanlun-engine"
version = "0.5.0"
description = "Chan Theory (缠论) technical analysis engine for A-share markets: fractal/stroke/pivot pipeline, type-1/2/3 buy-sell points, walk-forward backtesting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "plotly>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
